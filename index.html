<body>
  <section class="lock-screen" id="passwordGate" aria-labelledby="lockTitle">
    <form class="lock-card" id="lockForm">
      <div class="lock-brand"><div class="brand-mark" aria-hidden="true">衡</div><div><h1 id="lockTitle">进入衡价云</h1><p>项目造价数据工作台</p></div></div>
      <div class="field"><label for="passwordInput">访问密码</label><div class="password-wrap"><input id="passwordInput" name="password" type="password" autocomplete="current-password" required aria-describedby="passwordHint lockError"><button class="password-toggle" id="passwordToggle" type="button" aria-label="显示密码">显示</button></div></div>
      <p class="lock-error" id="lockError" role="alert" aria-live="polite"></p>
      <button class="btn btn-primary lock-submit" type="submit">解锁并进入</button>
      <small class="lock-hint" id="passwordHint">密码提示：我的 GitHub 用户名</small>
    </form>
  </section>
  <div class="hidden" id="appShell">
  <header class="appbar"><div class="appbar-inner">
    <div class="brand"><div class="brand-mark" aria-hidden="true">衡</div><div><strong>衡价云</strong><small>多项目造价管理数据库</small></div></div>
    <div class="appbar-context" id="appbarContext"><small>当前范围</small><b>全部项目</b></div>
    <div class="appbar-actions" id="appbarActions"></div>
  </div></header>

  <main class="page" id="homeView" tabindex="-1">
    <section class="hero" aria-labelledby="homeTitle"><p class="eyebrow">PROJECT COST DATABASE · 项目独立核算</p><h1 id="homeTitle">按业态归档，每个项目独立成账</h1><p>办公、住宅、商业综合体分别归组；每个项目只展示自己的目标、合同、结算与付款，不进行跨项目合计。</p><div class="portfolio-strip" id="portfolioStrip"></div></section>

    <div class="section-head"><div><h2>合同造价账卡</h2><p id="ledgerNote">总包自身与专业分包分别展示，并提供“总包+专业分包”汇总；独立承包单独核算。</p></div></div>
    <section class="tree" id="contractTree" aria-live="polite"></section>
  </main>

  <div class="modal-backdrop" id="projectModal" role="dialog" aria-modal="true" aria-labelledby="projectModalTitle"><form class="modal" id="projectForm"><div class="modal-head"><h3 id="projectModalTitle">新建项目</h3><button type="button" class="close" data-close aria-label="关闭">×</button></div><div class="modal-body"><div class="form-grid">
    <div class="field"><label for="projectCodeInput">项目编号</label><input id="projectCodeInput" name="projectCode" required></div><div class="field"><label for="projectNameInput">项目名称</label><input id="projectNameInput" name="projectName" required></div>

    <div class="field"><label for="statusInput">状态</label><select id="statusInput" name="status"><option>在建</option><option>完工</option><option>归档</option></select></div>
  </div></div><div class="modal-foot"><button type="button" class="btn btn-outline" data-close>取消</button><button class="btn btn-primary">保存项目</button></div></form></div>

  <div class="modal-backdrop" id="entryModal" role="dialog" aria-modal="true" aria-labelledby="entryTitle"><form class="modal" id="entryForm"><div class="modal-head"><h3 id="entryTitle">登记数据</h3><button type="button" class="close" data-close aria-label="关闭">×</button></div><div class="modal-body" id="entryBody"></div><div class="modal-foot"><button type="button" class="btn btn-outline" data-close>取消</button><button class="btn btn-primary">保存并刷新</button></div></form></div>

  <script src="https://cdn.jsdelivr.net/npm/dexie@4.0.11/dist/dexie.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script>
  (()=>{
    'use strict';
    const db=new Dexie('HengJiaYunMultiProjectDB_v1');
    db.version(1).stores({
      projects:'&projectId,projectCode,projectName,businessType,status,createdAt',
      contracts:'&contractId,projectId,parentContractId,contractType,contractCode,signDate',
      changes:'&changeId,contractId,changeDate,auditStatus',
      payments:'&paymentId,contractId,paymentDate,nodeName',
      files:'&fileId,relationType,relationId,[relationType+relationId],fileType'
    });
    const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
    const state={projectId:null,filter:'全部',expanded:{},trace:{},nodes:{},entryType:null,entryContractId:null,appStarted:false};
    const money=new Intl.NumberFormat('zh-CN',{minimumFractionDigits:2,maximumFractionDigits:2});
    const compact=new Intl.NumberFormat('zh-CN',{notation:'compact',maximumFractionDigits:2});
    const fmt=v=>money.format(Number(v)||0),pct=v=>`${((Number(v)||0)*100).toFixed(1)}%`,uid=p=>`${p}-${Date.now()}-${Math.random().toString(36).slice(2,7)}`,today=()=>new Date().toISOString().slice(0,10);
    const esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
    const tagClass=b=>b==='办公'?'tag-office':b==='住宅'?'tag-home':'tag-mall';
    const statusClass=s=>s==='在建'?'tag-building':s==='完工'?'tag-finished':'tag-archived';
    const defaultNodes=()=>[{name:'预付款',ratio:.30},{name:'进度款',ratio:.50},{name:'竣工验收',ratio:.17},{name:'质保金',ratio:.03}];
    const c=(id,p,parent,type,code,name,net,date)=>({contractId:id,projectId:p,parentContractId:parent,contractType:type,contractCode:code,contractName:name,amountNet:net,amountTax:net*1.09,signDate:date,nodes:defaultNodes()});

    async function seed(){
      if(await db.projects.count())return;
      const projects=[
        {projectId:'P-001',projectCode:'HJY-SSG-001',projectName:'新首钢国际人才社区',location:'北京市石景山区',businessType:'住宅',targetCostNet:50000000,buildingArea:35000,status:'在建',createdAt:'2026-01-05T09:00:00.000Z'},
        {projectId:'P-002',projectCode:'HJY-ZGC-002',projectName:'中关村科技园办公楼',location:'北京市海淀区',businessType:'办公',targetCostNet:32000000,buildingArea:18000,status:'在建',createdAt:'2026-02-12T09:00:00.000Z'},
        {projectId:'P-003',projectCode:'HJY-CY-003',projectName:'朝阳大悦城改造',location:'北京市朝阳区',businessType:'商业综合体',targetCostNet:80000000,buildingArea:55000,status:'在建',createdAt:'2026-03-18T09:00:00.000Z'}
      ];
      const contracts=[
        c('C-001','P-001',null,'总包合同','HT-SSG-ZB-001','主体结构总承包',30000000,'2026-01-15'),
        c('C-002','P-001','C-001','专业分包','HT-SSG-FB-001','基坑支护',5000000,'2026-01-22'),c('C-003','P-001','C-001','专业分包','HT-SSG-FB-002','防水工程',3000000,'2026-02-03'),c('C-004','P-001','C-001','专业分包','HT-SSG-FB-003','机电安装',8000000,'2026-02-15'),
        c('C-005','P-001',null,'总包合同','HT-SSG-ZB-002','精装修总承包',15000000,'2026-03-01'),c('C-006','P-001','C-005','专业分包','HT-SSG-FB-004','木作工程',4000000,'2026-03-12'),c('C-007','P-001','C-005','专业分包','HT-SSG-FB-005','石材工程',3500000,'2026-03-18'),
        c('C-008','P-001',null,'独立承包','HT-SSG-DL-001','电梯设备及安装',6000000,'2026-02-26'),
        c('C-009','P-002',null,'总包合同','HT-ZGC-ZB-001','施工总承包',28000000,'2026-02-20'),c('C-010','P-002','C-009','专业分包','HT-ZGC-FB-001','幕墙工程',6000000,'2026-03-03'),c('C-011','P-002',null,'独立承包','HT-ZGC-DL-001','消防工程',4000000,'2026-03-12'),
        c('C-012','P-003',null,'总包合同','HT-CY-ZB-001','结构改造总承包',40000000,'2026-03-25'),c('C-013','P-003','C-012','专业分包','HT-CY-FB-001','钢结构加固',12000000,'2026-04-02'),c('C-014','P-003','C-012','专业分包','HT-CY-FB-002','基础加固',8000000,'2026-04-08'),
        c('C-015','P-003',null,'总包合同','HT-CY-ZB-002','机电总承包',25000000,'2026-04-12'),c('C-016','P-003','C-015','专业分包','HT-CY-FB-003','暖通工程',7000000,'2026-04-20'),c('C-017','P-003','C-015','专业分包','HT-CY-FB-004','消防工程',5000000,'2026-04-23'),c('C-018','P-003',null,'独立承包','HT-CY-DL-001','外立面改造',15000000,'2026-04-28')
      ];
      const changes=[{changeId:'CH-001',contractId:'C-001',changeCode:'BG-001',changeType:'设计变更',amountTax:500000,auditStatus:'已审',changeDate:'2026-05-10'},{changeId:'CH-002',contractId:'C-012',changeCode:'QZ-001',changeType:'签证',amountTax:2000000,auditStatus:'已审',changeDate:'2026-06-08'}];
      const payments=[
        {paymentId:'PAY-001',contractId:'C-001',period:'2026-02 第1期',outputCumulativeTax:12000000,currentPaymentTax:9000000,deductionGuaranteeTax:0,deductionPenaltyTax:0,deductionOtherTax:0,amount:9000000,nodeName:'预付款',paymentDate:'2026-02-01'},
        {paymentId:'PAY-002',contractId:'C-001',period:'2026-05 第2期',outputCumulativeTax:26000000,currentPaymentTax:6200000,deductionGuaranteeTax:200000,deductionPenaltyTax:0,deductionOtherTax:0,amount:6000000,nodeName:'进度款',paymentDate:'2026-05-30'},
        {paymentId:'PAY-003',contractId:'C-009',period:'2026-03 第1期',outputCumulativeTax:11000000,currentPaymentTax:8400000,deductionGuaranteeTax:0,deductionPenaltyTax:0,deductionOtherTax:0,amount:8400000,nodeName:'预付款',paymentDate:'2026-03-10'},
        {paymentId:'PAY-004',contractId:'C-012',period:'2026-04 第1期',outputCumulativeTax:15000000,currentPaymentTax:12000000,deductionGuaranteeTax:0,deductionPenaltyTax:0,deductionOtherTax:0,amount:12000000,nodeName:'预付款',paymentDate:'2026-04-18'},
        {paymentId:'PAY-005',contractId:'C-012',period:'2026-06 第2期',outputCumulativeTax:30000000,currentPaymentTax:8500000,deductionGuaranteeTax:500000,deductionPenaltyTax:0,deductionOtherTax:0,amount:8000000,nodeName:'进度款',paymentDate:'2026-06-20'},
        {paymentId:'PAY-006',contractId:'C-015',period:'2026-05 第1期',outputCumulativeTax:10000000,currentPaymentTax:7500000,deductionGuaranteeTax:0,deductionPenaltyTax:0,deductionOtherTax:0,amount:7500000,nodeName:'预付款',paymentDate:'2026-05-09'}
      ];
      await db.transaction('rw',db.projects,db.contracts,db.changes,db.payments,async()=>{await db.projects.bulkAdd(projects);await db.contracts.bulkAdd(contracts);await db.changes.bulkAdd(changes);await db.payments.bulkAdd(payments)});
    }

    async function normalizePayments(){
      const samples={
        'PAY-001':{period:'2026-02 第1期',outputCumulativeTax:12000000,currentPaymentTax:9000000,deductionGuaranteeTax:0},'PAY-002':{period:'2026-05 第2期',outputCumulativeTax:26000000,currentPaymentTax:6200000,deductionGuaranteeTax:200000},
        'PAY-003':{period:'2026-03 第1期',outputCumulativeTax:11000000,currentPaymentTax:8400000,deductionGuaranteeTax:0},'PAY-004':{period:'2026-04 第1期',outputCumulativeTax:15000000,currentPaymentTax:12000000,deductionGuaranteeTax:0},
        'PAY-005':{period:'2026-06 第2期',outputCumulativeTax:30000000,currentPaymentTax:8500000,deductionGuaranteeTax:500000},'PAY-006':{period:'2026-05 第1期',outputCumulativeTax:10000000,currentPaymentTax:7500000,deductionGuaranteeTax:0}
      };
      const rows=await db.payments.toArray();
      await Promise.all(rows.map((p,index)=>{const s=samples[p.paymentId]||{};const next={...p,period:p.period||s.period||`${String(p.paymentDate||'').slice(0,7)} 第${index+1}期`,outputCumulativeTax:Number(p.outputCumulativeTax??s.outputCumulativeTax??p.amount??0),currentPaymentTax:Number(p.currentPaymentTax??s.currentPaymentTax??p.amount??0),deductionGuaranteeTax:Number(p.deductionGuaranteeTax??s.deductionGuaranteeTax??0),deductionPenaltyTax:Number(p.deductionPenaltyTax??0),deductionOtherTax:Number(p.deductionOtherTax??0)};next.amount=Number(p.amount??(next.currentPaymentTax-next.deductionGuaranteeTax-next.deductionPenaltyTax-next.deductionOtherTax));return db.payments.put(next)}));
    }

    async function projectData(projectId){
      const project=await db.projects.get(projectId);if(!project)return null;
      const contracts=await db.contracts.where('projectId').equals(projectId).toArray();const ids=contracts.map(x=>x.contractId);
      const changes=ids.length?await db.changes.where('contractId').anyOf(ids).toArray():[];const payments=ids.length?await db.payments.where('contractId').anyOf(ids).toArray():[];const files=ids.length?(await db.files.where('relationId').anyOf(ids).toArray()):[];
      return {project,contracts,changes,payments,files};
    }
    function ownCalc(project,contract,changes,payments){
      const cs=changes.filter(x=>x.contractId===contract.contractId),ps=payments.filter(x=>x.contractId===contract.contractId),taxRate=contract.amountNet?contract.amountTax/contract.amountNet-1:0,changeTax=cs.reduce((s,x)=>s+Number(x.amountTax||0),0),changeNet=changeTax/(1+taxRate),settleTax=Number(contract.amountTax||0)+changeTax,settleNet=Number(contract.amountNet||0)+changeNet,paidTax=ps.reduce((s,x)=>s+Number(x.amount||0),0),paidNet=paidTax/(1+taxRate),area=Number(project.buildingArea||0),target=Number(project.targetCostNet||0);
      return {taxRate,changeTax,changeNet,settleTax,settleNet,paidTax,paidNet,contractUnitNet:area?contract.amountNet/area:0,settleUnitNet:area?settleNet/area:0,changeRatio:contract.amountTax?changeTax/contract.amountTax:0,payRatio:settleNet?paidNet/settleNet:0,remainingTax:settleTax-paidTax,remainingNet:settleNet-paidNet,overTarget:settleNet-target};
    }
    function rollup(project,root,contracts,changes,payments){const members=[root,...contracts.filter(x=>x.parentContractId===root.contractId)],calcs=members.map(x=>ownCalc(project,x,changes,payments));return calcs.reduce((a,x)=>({contractTax:a.contractTax+x.settleTax-x.changeTax,contractNet:a.contractNet+(x.settleNet-x.changeNet),changeTax:a.changeTax+x.changeTax,changeNet:a.changeNet+x.changeNet,settleTax:a.settleTax+x.settleTax,settleNet:a.settleNet+x.settleNet,paidTax:a.paidTax+x.paidTax,paidNet:a.paidNet+x.paidNet}),{contractTax:0,contractNet:0,changeTax:0,changeNet:0,settleTax:0,settleNet:0,paidTax:0,paidNet:0})}
    function projectTotals(data){const roots=data.contracts.filter(x=>!x.parentContractId);return roots.reduce((a,r)=>{const g=rollup(data.project,r,data.contracts,data.changes,data.payments);for(const k of Object.keys(a))a[k]+=g[k];return a},{contractTax:0,contractNet:0,changeTax:0,changeNet:0,settleTax:0,settleNet:0,paidTax:0,paidNet:0})}

    async function render(){const p=new URLSearchParams(location.search).get('projectId');state.projectId=p||null;if(state.projectId)await renderProject();else await renderHome();requestAnimationFrame(checkOverflow)}
    async function renderHome(){
      $('#homeView').classList.remove('hidden');$('#projectView').classList.add('hidden');$('#appbarContext').innerHTML='<small>当前范围</small><b>全部项目</b>';$('#appbarActions').innerHTML='';
      const projects=await db.projects.orderBy('createdAt').toArray();const cards=await Promise.all(projects.map(async p=>{const d=await projectData(p.projectId);return {p,t:projectTotals(d)}})),filtered=cards.filter(x=>state.filter==='全部'||x.p.businessType===state.filter);
      $('#portfolioStrip').innerHTML=businessGroups(filtered,portfolioGroup);
      $('#projectGrid').innerHTML=filtered.length?businessGroups(filtered,(type,items)=>`<section class="business-section"><h3 class="business-title">${type}<span class="business-count">${items.length} 个独立项目</span></h3><div class="project-grid-inner">${items.map((x,i)=>projectCard(x,i+1)).join('')}</div></section>`):'<div class="empty"><h3>没有符合筛选条件的项目</h3><p>切换其他业态或新建项目。</p></div>';bindHome();
    }
    function businessGroups(cards,renderer){return ['办公','住宅','商业综合体'].map(type=>{const items=cards.filter(x=>x.p.businessType===type);return items.length?renderer(type,items):''}).join('')}
    function portfolioGroup(type,items){const cls=type==='办公'?'office':type==='商业综合体'?'mall':'';return `<section class="portfolio-group ${cls}"><div class="portfolio-type">${type}</div><div class="portfolio-projects">${items.map((x,i)=>{const over=x.t.settleNet-x.p.targetCostNet;return `<div class="portfolio-stat"><div class="portfolio-name"><span>${type} ${i+1} · ${esc(x.p.projectCode)}</span><strong>${esc(x.p.projectName)}</strong></div><div class="portfolio-cell"><span>目标成本·不含税</span><strong class="num">¥ ${compact.format(x.p.targetCostNet)}</strong></div><div class="portfolio-cell"><span>合同总额·不含税</span><strong class="num">¥ ${compact.format(x.t.contractNet)}</strong></div><div class="portfolio-cell"><span>动态结算·不含税</span><strong class="num">¥ ${compact.format(x.t.settleNet)}</strong></div><div class="portfolio-cell"><span>累计付款·不含税</span><strong class="num">¥ ${compact.format(x.t.paidNet)}</strong></div>${over>0?`<span class="sr-only">超目标 ${fmt(over)} 元</span>`:''}</div>`}).join('')}</div></section>`}
    function projectCard({p,t},sequence){const pay=t.settleNet?t.paidNet/t.settleNet:0;return `<button class="project-card" data-open-project="${p.projectId}" aria-label="进入项目：${esc(p.projectName)}"><div class="project-card-head"><div class="tag-row"><span class="tag ${tagClass(p.businessType)}">${p.businessType}</span><span class="tag ${statusClass(p.status)}">${p.status}</span><span class="project-sequence">${p.businessType} ${sequence}</span></div><h3>${esc(p.projectName)}</h3><span class="project-code">${esc(p.projectCode)}</span></div><div class="project-card-body"><div class="project-kpis"><div class="mini-kpi"><span>目标成本（不含税）</span><strong class="num">¥ ${fmt(p.targetCostNet)}</strong></div><div class="mini-kpi"><span>合同总额（不含税）</span><strong class="num">¥ ${fmt(t.contractNet)}</strong></div><div class="mini-kpi"><span>动态结算（不含税）</span><strong class="num">¥ ${fmt(t.settleNet)}</strong></div><div class="mini-kpi"><span>建筑面积</span><strong class="num">${fmt(p.buildingArea)} ㎡</strong></div></div><div class="project-card-foot"><div class="ring-wrap"><div class="ring" style="--p:${Math.min(pay*100,100)}"><b>${Math.round(pay*100)}%</b></div><div class="ring-note"><span>付款进度（不含税）</span><b class="num">¥ ${compact.format(t.paidNet)}</b></div></div><span class="enter-hint">进入项目 →</span></div></div></button>`}

    async function renderProject(){
      const data=await projectData(state.projectId);if(!data){goHome();return}const {project,contracts,changes,payments,files}=data,t=projectTotals(data),projectRate=t.contractNet?t.contractTax/t.contractNet-1:.09,targetTax=project.targetCostNet*(1+projectRate),over=t.settleNet-project.targetCostNet,overTax=t.settleTax-targetTax;
      $('#homeView').classList.add('hidden');$('#projectView').classList.remove('hidden');$('#appbarContext').innerHTML=`<small>当前项目</small><b>${esc(project.projectName)} · ${esc(project.projectCode)}</b>`;$('#appbarActions').innerHTML=`<button class="btn btn-dark" id="homeBtn">← 返回首页</button><button class="btn btn-primary" id="exportBtn">导出本项目 Excel</button>`;
      $('#currentProjectTitle').textContent=project.projectName;$('#currentProjectCode').textContent=project.projectCode;$('#currentProjectTags').innerHTML=`<span class="tag ${tagClass(project.businessType)}">${project.businessType}</span><span class="tag ${statusClass(project.status)}">${project.status}</span>`;$('#currentProjectInfo').innerHTML=`<span>地点：${esc(project.location)}</span><span>建筑面积：${fmt(project.buildingArea)} ㎡</span><span>创建日期：${new Date(project.createdAt).toLocaleDateString('zh-CN')}</span><span>合同 ${contracts.length} 份</span><span>变更 ${changes.length} 份</span><span>付款 ${payments.length} 期</span><span>综合税率 ${pct(projectRate)}</span>`;
      const ratio=v=>t.settleNet?v/t.settleNet:0;$('#coreGrid').innerHTML=[['目标成本（不含税）',project.targetCostNet,targetTax,ratio(project.targetCostNet),false],['合同总额（不含税）',t.contractNet,t.contractTax,ratio(t.contractNet),false],['动态结算（不含税）',t.settleNet,t.settleTax,ratio(t.settleNet),false],['超目标成本（不含税）',over,overTax,ratio(over),over>0],['累计付款（不含税）',t.paidNet,t.paidTax,ratio(t.paidNet),false]].map(x=>`<div class="core-kpi ${x[4]?'alert':''}"><span>${x[0]}</span><strong class="num">${x[4]?'<span class="warn-icon" aria-hidden="true">⚠</span>':''}${x[1]>0&&x[0].startsWith('超')?'+':''}¥ ${fmt(x[1])}</strong><small>含税 ¥ ${fmt(x[2])}<br>占动态结算 ${pct(x[3])}</small></div>`).join('');
      const roots=contracts.filter(x=>!x.parentContractId);$('#contractTree').innerHTML=roots.length?roots.map(r=>contractGroup(project,r,contracts,changes,payments,files)).join(''):'<div class="empty"><h3>当前项目没有合同</h3><p>项目已建立，等待录入合同。</p></div>';bindProject(data);
    }
    function contractGroup(project,root,contracts,changes,payments,files){
      const children=contracts.filter(x=>x.parentContractId===root.contractId),expanded=state.expanded[root.contractId]!==false,group=rollup(project,root,contracts,changes,payments);
      const summary=children.length?`<div class="group-summary"><div class="group-summary-head"><h4>总包 + 专业分包汇总</h4><span class="formula">${esc(root.contractName)}自身 + ${children.length} 个专业分包</span></div><div class="group-summary-grid"><div class="group-total"><span>合同金额（不含税）</span><strong class="num">¥ ${fmt(group.contractNet)}</strong><small>含税 ¥ ${fmt(group.contractTax)}</small></div><div class="group-total"><span>变更累计（不含税）</span><strong class="num">¥ ${fmt(group.changeNet)}</strong><small>含税 ¥ ${fmt(group.changeTax)}</small></div><div class="group-total"><span>动态结算（不含税）</span><strong class="num">¥ ${fmt(group.settleNet)}</strong><small>含税 ¥ ${fmt(group.settleTax)}</small></div><div class="group-total"><span>付款累计（不含税）</span><strong class="num">¥ ${fmt(group.paidNet)}</strong><small>含税 ¥ ${fmt(group.paidTax)}</small></div></div></div>`:'';
      return `<div class="contract-group">${contractCard(project,root,changes,payments,files,children.length,expanded)}${summary}${children.length&&expanded?children.map(x=>contractCard(project,x,changes,payments,files,0,false)).join(''):''}</div>`
    }
    function metric(id,key,label,value,note,alert=false){const open=state.trace[id]===key;return `<button class="metric ${alert?'alert':''}" data-trace="${key}" data-id="${id}" aria-expanded="${open}"><span class="metric-label">${alert?'<span><span class="warn-icon" aria-hidden="true">⚠</span>'+label+'</span>':label}</span><strong class="metric-value">${value}</strong><small class="metric-note">${note}</small></button>`}
    function contractCard(project,contract,changes,payments,files,childCount,expanded){const o=ownCalc(project,contract,changes,payments),isSub=contract.contractType==='专业分包',isIndependent=contract.contractType==='独立承包',trace=state.trace[contract.contractId],nodesOpen=state.nodes[contract.contractId],ownFiles=files.filter(f=>f.relationType==='合同'&&f.relationId===contract.contractId);return `<article class="contract-card ${isSub?'sub':''} ${isIndependent?'independent':''}"><header class="contract-head"><div class="contract-identity">${childCount?`<button class="tree-toggle" data-tree="${contract.contractId}" aria-expanded="${expanded}" aria-label="${expanded?'折叠':'展开'}专业分包">${expanded?'−':'+'}</button>`:'<span class="tree-spacer"></span>'}<div><span class="contract-type">${contract.contractType}${childCount?` · ${childCount} 个专业分包`:''}</span><h3>${esc(contract.contractName)}</h3><div class="contract-meta num">${esc(contract.contractCode)} · 签订 ${esc(contract.signDate)} · 推算税率 ${pct(o.taxRate)}</div>${childCount?'<span class="own-scope">本卡仅显示总包自身，不含专业分包</span>':''}</div></div><div class="contract-actions"><input class="file-input" type="file" id="file-${contract.contractId}" data-file="${contract.contractId}" accept=".xlsx,.xls,.pdf,image/*"><label class="btn btn-outline btn-small" for="file-${contract.contractId}">上传原始清单</label><button class="btn btn-outline btn-small" data-entry="change" data-id="${contract.contractId}">登记变更</button><button class="btn btn-primary btn-small" data-entry="payment" data-id="${contract.contractId}">登记付款</button></div></header><div class="metric-grid">
      ${metric(contract.contractId,'contract',childCount?'总包自身合同金额':'合同金额',`¥ ${fmt(contract.amountNet)}`,`不含税 · 含税 ¥ ${fmt(contract.amountTax)}`)}${metric(contract.contractId,'unit','合同单方',`¥ ${fmt(o.contractUnitNet)}`,'不含税 · 元/㎡')}${metric(contract.contractId,'change','变更累计',`¥ ${fmt(o.changeNet)}`,`不含税 · 含税 ¥ ${fmt(o.changeTax)} · 占合同 ${pct(o.changeRatio)}`)}${metric(contract.contractId,'settle','结算金额',`¥ ${fmt(o.settleNet)}`,`不含税 · 含税 ¥ ${fmt(o.settleTax)}`)}
      ${metric(contract.contractId,'settleUnit','结算单方',`¥ ${fmt(o.settleUnitNet)}`,'不含税 · 元/㎡')}${metric(contract.contractId,'target','超目标成本',`${o.overTarget>0?'+':''}¥ ${fmt(o.overTarget)}`,'结算不含税 − 项目目标成本',o.overTarget>0)}${metric(contract.contractId,'payment','付款累计',`¥ ${fmt(o.paidNet)}`,`不含税 · 含税 ¥ ${fmt(o.paidTax)} · 占结算 ${pct(o.payRatio)}`)}${metric(contract.contractId,'remaining','剩余未付',`¥ ${fmt(o.remainingNet)}`,`不含税 · 含税 ¥ ${fmt(o.remainingTax)}`,o.remainingNet<0)}
      </div>${trace?traceBlock(trace,project,contract,changes,payments,o):''}<footer class="contract-foot"><div class="files"><span>附件 ${ownFiles.length}</span>${ownFiles.map(f=>`<button class="file-chip" data-open-file="${f.fileId}" title="${esc(f.fileName)}"><span class="file-icon">${f.fileType==='excel'?'XLS':f.fileType==='pdf'?'PDF':'IMG'}</span>${esc(f.fileName)}</button>`).join('')}</div><button class="btn btn-outline btn-small node-btn" data-nodes="${contract.contractId}" aria-expanded="${!!nodesOpen}">${nodesOpen?'收起付款节点':'展开付款节点'}</button></footer>${nodesOpen?nodeTable(contract,payments,o.settleTax):''}</article>`}
    function traceBlock(key,project,contract,changes,payments,o){let title='',formula='',rows=[];const cs=changes.filter(x=>x.contractId===contract.contractId),ps=payments.filter(x=>x.contractId===contract.contractId);if(key==='payment')return paymentPeriodTable(ps,o.taxRate);if(key==='contract'){title='合同金额溯源';formula='含税 ÷ (1 + 税率) = 不含税';rows=[['合同金额（含税）',contract.contractCode,`¥ ${fmt(contract.amountTax)}`],['合同金额（不含税）',`税率 ${pct(o.taxRate)}`,`¥ ${fmt(contract.amountNet)}`]]}if(key==='unit'){title='合同单方溯源';formula='合同不含税 ÷ 建筑面积';rows=[['合同金额（不含税）',contract.contractCode,`¥ ${fmt(contract.amountNet)}`],['建筑面积',project.projectCode,`${fmt(project.buildingArea)} ㎡`],['合同单方','自动计算',`¥ ${fmt(o.contractUnitNet)} /㎡`]]}if(key==='change'){title='变更累计溯源';formula='Σ 变更含税金额 ÷ (1 + 税率)';rows=cs.length?cs.map(x=>[`${x.changeCode} · ${x.changeType}`,`${x.changeDate} · ${x.auditStatus}`,`不含税 ¥ ${fmt(x.amountTax/(1+o.taxRate))} · 含税 ¥ ${fmt(x.amountTax)}`]):[['暂无变更','登记后自动计入','¥ 0.00']]}if(key==='settle'){title='结算金额溯源';formula='合同金额 + 变更累计';rows=[['合同金额（不含税）',contract.contractCode,`¥ ${fmt(contract.amountNet)}`],['变更累计（不含税）',`${cs.length} 份`,`¥ ${fmt(o.changeNet)}`],['结算金额（不含税）','自动计算',`¥ ${fmt(o.settleNet)}`]]}if(key==='settleUnit'){title='结算单方溯源';formula='结算不含税 ÷ 建筑面积';rows=[['结算金额（不含税）','合同 + 变更折税',`¥ ${fmt(o.settleNet)}`],['建筑面积',project.projectCode,`${fmt(project.buildingArea)} ㎡`],['结算单方','自动计算',`¥ ${fmt(o.settleUnitNet)} /㎡`]]}if(key==='target'){title='目标成本预警溯源';formula='结算不含税 − 项目目标成本不含税';rows=[['结算金额（不含税）',contract.contractCode,`¥ ${fmt(o.settleNet)}`],['项目目标成本（不含税）',project.projectCode,`¥ ${fmt(project.targetCostNet)}`],['差额',o.overTarget>0?'超目标预警':'目标内',`${o.overTarget>0?'+':''}¥ ${fmt(o.overTarget)}`]]}if(key==='remaining'){title='剩余未付溯源';formula='结算不含税 − 付款累计不含税';rows=[['结算金额（不含税）','合同 + 变更',`¥ ${fmt(o.settleNet)}`],['付款累计（不含税）',`${ps.length} 期`,`− ¥ ${fmt(o.paidNet)}`],['剩余未付（不含税）','自动计算',`¥ ${fmt(o.remainingNet)}`]]}return `<div class="trace"><div class="trace-top"><h4>${title}</h4><span class="formula">${formula}</span></div><div class="trace-list">${rows.map(r=>`<div class="trace-row"><span>${esc(r[0])}</span><span>${esc(r[1])}</span><span>${esc(r[2])}</span></div>`).join('')}</div></div>`}
    function moneyPair(tax,taxRate){return `<div class="money-pair"><strong class="num">¥ ${fmt(Number(tax||0)/(1+taxRate))}</strong><small class="num">含税 ¥ ${fmt(tax)}</small></div>`}
    function paymentPeriodTable(payments,taxRate){const rows=[...payments].sort((a,b)=>String(a.paymentDate).localeCompare(String(b.paymentDate)));let cumulativeTax=0;const body=rows.map((p,i)=>{const guarantee=Number(p.deductionGuaranteeTax||0),penalty=Number(p.deductionPenaltyTax||0),other=Number(p.deductionOtherTax||0),deduction=guarantee+penalty+other,actual=Number(p.amount||0);cumulativeTax+=actual;return `<tr><td>${esc(p.period||`第${i+1}期`)}</td><td>${esc(p.paymentDate)}</td><td>${esc(p.nodeName)}</td><td>${moneyPair(p.outputCumulativeTax,taxRate)}</td><td>${moneyPair(p.currentPaymentTax,taxRate)}</td><td><div class="deduction-detail">保函 ${moneyPair(guarantee,taxRate)}罚款 ${moneyPair(penalty,taxRate)}其他 ${moneyPair(other,taxRate)}</div></td><td>${moneyPair(actual,taxRate)}</td><td>${moneyPair(cumulativeTax,taxRate)}</td></tr>`}).join('');return `<div class="trace"><div class="trace-top"><h4>付款分期明细</h4><span class="formula">本期实付 = 当月付款 − 保函 − 罚款 − 其他扣减</span></div><div class="scroll-shell"><div class="table-scroll"><table class="payment-table"><thead><tr><th>期次</th><th>付款日期</th><th>付款节点</th><th class="num">累计产值（元）</th><th class="num">当月付款（元）</th><th>扣减项（元）</th><th class="num">本期实付（元）</th><th class="num">累计实付（元）</th></tr></thead><tbody>${body||'<tr><td colspan="8">暂无付款分期，登记后自动汇总。</td></tr>'}${rows.length?`<tr class="payment-total-row"><td colspan="7">付款累计（不含税 / 含税）</td><td>${moneyPair(cumulativeTax,taxRate)}</td></tr>`:''}</tbody></table></div><div class="scroll-hint">← 横向滑动查看更多 →</div></div></div>`}
    function nodeTable(contract,payments,settleTax){const ps=payments.filter(x=>x.contractId===contract.contractId);return `<section class="nodes"><div class="node-head"><div><h4>付款节点</h4><p>节点应付额始终使用最新结算含税金额计算。</p></div><span class="formula">节点应付 = 结算含税 × 节点比例</span></div><div class="scroll-shell"><div class="table-scroll"><table><thead><tr><th>节点名称</th><th class="num">节点比例</th><th class="num">应付金额（含税，元）</th><th class="num">已付金额（含税，元）</th><th class="num">未付金额（含税，元）</th></tr></thead><tbody>${contract.nodes.map(n=>{const due=settleTax*n.ratio,paid=ps.filter(p=>p.nodeName===n.name).reduce((s,p)=>s+Number(p.amount),0),left=due-paid;return `<tr><td>${esc(n.name)}</td><td class="num">${pct(n.ratio)}</td><td class="num">¥ ${fmt(due)}</td><td class="num">¥ ${fmt(paid)}</td><td class="num ${left<0?'negative':''}">${left<0?'<span class="warn-icon" aria-hidden="true">⚠</span>':''}¥ ${fmt(left)}</td></tr>`}).join('')}</tbody></table></div><div class="scroll-hint">← 横向滑动查看更多 →</div></div></section>`}

    function bindHome(){$$('[data-filter]').forEach(b=>b.addEventListener('click',()=>{state.filter=b.dataset.filter;$$('[data-filter]').forEach(x=>x.setAttribute('aria-pressed',x===b));renderHome()}));$$('[data-open-project]').forEach(b=>b.addEventListener('click',()=>openProject(b.dataset.openProject)))}
    function bindProject(data){$('#homeBtn').addEventListener('click',goHome);$('#exportBtn').addEventListener('click',()=>exportProject(data));$$('[data-tree]').forEach(b=>b.addEventListener('click',()=>{state.expanded[b.dataset.tree]=!b.getAttribute('aria-expanded').includes('true');renderProject()}));$$('[data-trace]').forEach(b=>b.addEventListener('click',()=>{state.trace[b.dataset.id]=state.trace[b.dataset.id]===b.dataset.trace?null:b.dataset.trace;renderProject()}));$$('[data-nodes]').forEach(b=>b.addEventListener('click',()=>{state.nodes[b.dataset.nodes]=!state.nodes[b.dataset.nodes];renderProject()}));$$('[data-entry]').forEach(b=>b.addEventListener('click',()=>openEntry(b.dataset.id,b.dataset.entry)));$$('[data-file]').forEach(i=>i.addEventListener('change',e=>saveFile(e.target.dataset.file,e.target.files[0])));$$('[data-open-file]').forEach(b=>b.addEventListener('click',()=>openFile(b.dataset.openFile)))}
    function openProject(id){history.pushState({projectId:id},'',`?projectId=${encodeURIComponent(id)}`);state.projectId=id;renderProject();scrollTo({top:0,behavior:'smooth'})}function goHome(){history.pushState({},'',location.pathname);state.projectId=null;state.trace={};state.nodes={};renderHome();scrollTo({top:0,behavior:'smooth'})}
    function openEntry(id,type){state.entryContractId=id;state.entryType=type;$('#entryTitle').textContent=type==='change'?'登记变更':'登记付款分期';$('#entryBody').innerHTML=type==='change'?`<div class="form-grid"><div class="field"><label for="changeCode">变更编号</label><input id="changeCode" name="changeCode" required></div><div class="field"><label for="changeType">变更类型</label><select id="changeType" name="changeType"><option>设计变更</option><option>签证</option><option>索赔</option></select></div><div class="field"><label for="changeAmount">变更金额（含税，元）</label><input id="changeAmount" name="amountTax" type="number" step="0.01" required></div><div class="field"><label for="auditStatus">审定状态</label><select id="auditStatus" name="auditStatus"><option>待审</option><option>已审</option></select></div><div class="field"><label for="changeDate">变更日期</label><input id="changeDate" name="changeDate" type="date" value="${today()}" required></div></div>`:`<div class="form-grid"><div class="field"><label for="paymentPeriod">付款期次</label><input id="paymentPeriod" name="period" placeholder="例如：2026-08 第3期" required></div><div class="field"><label for="paymentDate">付款日期</label><input id="paymentDate" name="paymentDate" type="date" value="${today()}" required></div><div class="field"><label for="nodeName">付款节点名称</label><select id="nodeName" name="nodeName"></select></div><div class="field"><label for="outputCumulative">累计产值（含税，元）</label><input id="outputCumulative" name="outputCumulativeTax" type="number" min="0" step="0.01" required></div><div class="field"><label for="currentPayment">当月付款（含税，元）</label><input id="currentPayment" name="currentPaymentTax" type="number" min="0.01" step="0.01" required></div><div class="field"><label for="deductionGuarantee">保函扣减（含税，元）</label><input id="deductionGuarantee" name="deductionGuaranteeTax" type="number" min="0" step="0.01" value="0"></div><div class="field"><label for="deductionPenalty">罚款扣减（含税，元）</label><input id="deductionPenalty" name="deductionPenaltyTax" type="number" min="0" step="0.01" value="0"></div><div class="field"><label for="deductionOther">其他扣减（含税，元）</label><input id="deductionOther" name="deductionOtherTax" type="number" min="0" step="0.01" value="0"></div><div class="field full"><small>本期实付将自动按“当月付款 − 保函 − 罚款 − 其他扣减”计算，并计入累计付款。</small></div></div>`;if(type==='payment')db.contracts.get(id).then(c=>{$('#nodeName').innerHTML=c.nodes.map(n=>`<option>${esc(n.name)}</option>`).join('')});openModal('entryModal')}
    async function saveFile(contractId,file){if(!file)return;const kind=/excel|spreadsheet|\.xls/i.test(file.type+file.name)?'excel':/pdf/i.test(file.type+file.name)?'pdf':'scan';await db.files.add({fileId:uid('F'),relationType:'合同',relationId:contractId,fileName:file.name,fileType:kind,fileBlob:file,createdAt:new Date().toISOString()});toast(`已保存原始文件：${file.name}`);renderProject()}
    async function openFile(id){const f=await db.files.get(id);if(!f)return;const url=URL.createObjectURL(f.fileBlob);if(f.fileType==='excel'){const a=document.createElement('a');a.href=url;a.download=f.fileName;a.click()}else window.open(url,'_blank','noopener');setTimeout(()=>URL.revokeObjectURL(url),60000)}
    async function exportProject(data){if(!window.XLSX){toast('Excel 导出组件未加载，请检查网络后重试。',true);return}const wb=XLSX.utils.book_new(),p=data.project;XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet([p]),'项目');XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(data.contracts.map(x=>({...x,nodes:JSON.stringify(x.nodes)}))),'合同');XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(data.changes),'变更');XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(data.payments),'付款');XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(data.files.map(({fileBlob,...x})=>x)),'文件索引');XLSX.writeFile(wb,`${p.projectCode}-${p.projectName}-造价数据库.xlsx`);toast('本项目数据已导出为 Excel。')}
    function openModal(id){const m=$('#'+id);m.classList.add('show');m.querySelector('input,select,button')?.focus()}function closeModals(){$$('.modal-backdrop.show').forEach(x=>x.classList.remove('show'))}function toast(msg,error=false){const t=$('#toast');t.textContent=msg;t.className=`toast show${error?' error':''}`;clearTimeout(toast.timer);toast.timer=setTimeout(()=>t.className='toast',3500)}function checkOverflow(){$$('.scroll-shell').forEach(s=>{const x=s.querySelector('.table-scroll');s.classList.toggle('is-overflowing',x.scrollWidth>x.clientWidth+2)})}
    $('#newProjectBtn').addEventListener('click',()=>openModal('projectModal'));$('#projectForm').addEventListener('submit',async e=>{e.preventDefault();const v=Object.fromEntries(new FormData(e.target));if(await db.projects.where('projectCode').equals(v.projectCode.trim()).first()){toast('项目编号已存在，请修改后再保存。',true);return}const p={projectId:uid('P'),projectCode:v.projectCode.trim(),projectName:v.projectName.trim(),location:v.location.trim(),businessType:v.businessType,targetCostNet:Number(v.targetCostNet),buildingArea:Number(v.buildingArea),status:v.status,createdAt:new Date().toISOString()};await db.projects.add(p);e.target.reset();closeModals();toast('项目已新建。');openProject(p.projectId)});
    $('#entryForm').addEventListener('submit',async e=>{e.preventDefault();const v=Object.fromEntries(new FormData(e.target));if(state.entryType==='change')await db.changes.add({changeId:uid('CH'),contractId:state.entryContractId,changeCode:v.changeCode.trim(),changeType:v.changeType,amountTax:Number(v.amountTax),auditStatus:v.auditStatus,changeDate:v.changeDate});else{const current=Number(v.currentPaymentTax),guarantee=Number(v.deductionGuaranteeTax||0),penalty=Number(v.deductionPenaltyTax||0),other=Number(v.deductionOtherTax||0),actual=current-guarantee-penalty-other;if(actual<0){toast('扣减项合计不能大于当月付款。',true);return}await db.payments.add({paymentId:uid('PAY'),contractId:state.entryContractId,period:v.period.trim(),outputCumulativeTax:Number(v.outputCumulativeTax),currentPaymentTax:current,deductionGuaranteeTax:guarantee,deductionPenaltyTax:penalty,deductionOtherTax:other,amount:actual,nodeName:v.nodeName,paymentDate:v.paymentDate})}e.target.reset();closeModals();toast(state.entryType==='change'?'变更已保存，结算及预警已实时更新。':'付款分期已保存，累计付款及节点余额已实时更新。');renderProject()});
    $$('[data-close]').forEach(b=>b.addEventListener('click',closeModals));$$('.modal-backdrop').forEach(m=>m.addEventListener('click',e=>{if(e.target===m)closeModals()}));document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModals()});window.addEventListener('popstate',render);window.addEventListener('resize',checkOverflow);
    const PASSWORD_HASH='4b1c599cfb276f6ac1a81b60468b1ff31dd5b838cbeda4bfb1f804e8d1e80f8c';
    async function hashPassword(value){const bytes=new TextEncoder().encode(value),digest=await crypto.subtle.digest('SHA-256',bytes);return [...new Uint8Array(digest)].map(x=>x.toString(16).padStart(2,'0')).join('')}
    async function startApp(){if(state.appStarted)return;state.appStarted=true;$('#passwordGate').classList.add('hidden');$('#appShell').classList.remove('hidden');if(!window.Dexie){$('#appShell').innerHTML='<main class="page"><div class="empty"><h3>数据库组件未加载</h3><p>请检查网络连接后刷新页面。</p></div></main>';return}try{await seed();await normalizePayments();await render()}catch(err){console.error(err);toast('IndexedDB 初始化失败，请确认浏览器允许本地存储。',true)}}
    $('#passwordToggle').addEventListener('click',()=>{const input=$('#passwordInput'),show=input.type==='password';input.type=show?'text':'password';$('#passwordToggle').textContent=show?'隐藏':'显示';$('#passwordToggle').setAttribute('aria-label',show?'隐藏密码':'显示密码');input.focus()});
    $('#lockForm').addEventListener('submit',async e=>{e.preventDefault();const input=$('#passwordInput'),hash=await hashPassword(input.value);if(hash!==PASSWORD_HASH){$('#lockError').textContent='密码不正确，请根据提示重新输入。';input.select();return}sessionStorage.setItem('hjy-access','granted');$('#lockError').textContent='';await startApp()});
    if(sessionStorage.getItem('hjy-access')==='granted')startApp();else $('#passwordInput').focus();
  })();
  </script>
