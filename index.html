<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="衡价云——多项目造价管理数据库">
  <title>衡价云｜多项目造价管理数据库</title>
  <style>
    :root{
      --ink:#13211d;--ink-2:#1b3029;--jade:#176b59;--jade-2:#238871;--jade-light:#98c8b9;

    *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--paper);color:var(--ink);font-family:SimSun,"宋体",serif;font-size:16px;line-height:1.55}
    button,input,select{font:inherit;color:inherit}button,label[for],select{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible,[tabindex]:focus-visible{outline:3px solid #6dc4af;outline-offset:2px}
    .num{font-family:Arial,sans-serif;font-variant-numeric:tabular-nums}.appbar{position:sticky;top:0;z-index:50;background:var(--ink);color:#fff;border-bottom:3px solid var(--jade-2)}
    .appbar-inner{max-width:1560px;min-height:72px;margin:auto;padding:11px 26px;display:flex;align-items:center;gap:18px}.brand{display:flex;align-items:center;gap:11px;min-width:max-content}.brand-mark{width:42px;height:42px;display:grid;place-items:center;background:var(--jade);border:1px solid rgba(255,255,255,.3);font-size:22px;font-weight:700}.brand strong{font-size:19px;letter-spacing:.08em}.brand small{display:block;color:#c9d5d1;font-size:12px;margin-top:1px}
    .appbar-context{margin-left:22px;padding-left:22px;border-left:1px solid #496159;min-width:0}.appbar-context small,.appbar-context b{display:block}.appbar-context small{font-size:12px;color:#b8c8c2}.appbar-context b{font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.appbar-actions{margin-left:auto;display:flex;align-items:center;gap:8px}

    .page{max-width:1560px;margin:auto;padding:24px 26px 64px}.hidden{display:none!important}.hero{position:relative;overflow:hidden;background:linear-gradient(118deg,#fff 0,#fff 67%,#e8f2ee 100%);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:25px 28px}.hero:after,.project-banner:after{content:"";position:absolute;right:0;bottom:0;width:34%;height:13px;background:repeating-linear-gradient(90deg,var(--jade) 0 1px,transparent 1px 15px);opacity:.32}.eyebrow{margin:0 0 6px;color:var(--jade);font-size:13px;font-weight:700;letter-spacing:.09em}.hero h1{margin:0;font-size:29px;line-height:1.3}.hero p{color:var(--muted);margin:8px 0 0}.portfolio-strip{display:grid;grid-template-columns:repeat(4,1fr);margin-top:22px;padding-top:18px;border-top:1px solid var(--line)}.portfolio-stat{padding:0 20px;border-left:1px solid var(--line)}.portfolio-stat:first-child{border-left:0;padding-left:0}.portfolio-stat span,.portfolio-stat strong,.portfolio-stat small{display:block}.portfolio-stat span{font-size:13px;color:var(--muted)}.portfolio-stat strong{font-size:25px;margin:4px 0}.portfolio-stat small{font-size:12px;color:var(--muted)}
    .filterbar{display:flex;align-items:center;justify-content:space-between;gap:14px;margin:22px 0 14px}.filterbar h2{font-size:21px;margin:0}.segmented{display:flex;gap:5px;padding:4px;background:#e5ece8;border-radius:8px}.segmented button{min-height:38px;border:0;border-radius:6px;background:transparent;padding:7px 14px}.segmented button[aria-pressed="true"]{background:#fff;color:var(--jade);font-weight:700;box-shadow:0 2px 9px rgba(19,33,29,.08)}

    .project-card-body{padding:18px 20px}.project-kpis{display:grid;grid-template-columns:1fr 1fr;gap:15px 12px}.mini-kpi span,.mini-kpi strong{display:block}.mini-kpi span{font-size:12px;color:var(--muted)}.mini-kpi strong{font-size:17px;margin-top:3px}.project-card-foot{margin-top:17px;padding-top:14px;border-top:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:16px}.ring-wrap{display:flex;align-items:center;gap:10px}.ring{--p:0;width:56px;height:56px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--jade-2) calc(var(--p)*1%),#dfe7e3 0);position:relative}.ring:before{content:"";position:absolute;inset:7px;border-radius:50%;background:#fff}.ring b{position:relative;font-family:Arial;font-size:12px}.ring-note span,.ring-note b{display:block}.ring-note span{font-size:11px;color:var(--muted)}.ring-note b{font-size:13px}.enter-hint{font-weight:700;color:var(--jade);font-size:13px}.fab{position:fixed;right:28px;bottom:28px;z-index:40;min-height:52px;border:0;border-radius:999px;padding:12px 20px;background:var(--jade-2);color:#fff;font-weight:700;box-shadow:0 10px 28px rgba(23,107,89,.28)}.fab:hover{background:#2b9c82}
    .empty{grid-column:1/-1;background:#fff;border:1px dashed #aab9b3;border-radius:var(--radius);padding:48px 24px;text-align:center}.empty h3{margin:0 0 6px}.empty p{margin:0;color:var(--muted)}
    .project-nav{display:flex;align-items:center;gap:15px;min-width:0}.back-btn{min-width:max-content}.project-banner{position:relative;overflow:hidden;background:#fff;border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:22px 25px;margin-bottom:16px}.project-banner-row{display:flex;justify-content:space-between;align-items:flex-start;gap:20px}.project-banner h1{font-size:25px;margin:0}.project-banner .project-code{margin-top:5px}.project-info{display:flex;gap:8px 22px;flex-wrap:wrap;margin-top:14px;color:var(--muted);font-size:14px}.project-info span+span{position:relative}.project-info span+span:before{content:"";position:absolute;left:-12px;top:.55em;width:3px;height:3px;border-radius:50%;background:#82958d}

    .section-head{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;margin:0 0 12px}.section-head h2{font-size:21px;margin:0}.section-head p{font-size:13px;color:var(--muted);margin:4px 0 0}.tree{display:grid;gap:15px}.contract-group{display:grid;gap:10px}.contract-card{background:#fff;border:1px solid var(--line);border-left:3px solid var(--jade);border-radius:10px;box-shadow:var(--shadow);overflow:hidden}.contract-card.sub{margin-left:34px;border-left:2px solid var(--jade-light);box-shadow:none}.contract-card.independent{border-left-color:var(--blue)}.contract-head{padding:16px 18px;display:flex;align-items:flex-start;justify-content:space-between;gap:16px;border-bottom:1px solid var(--line)}.contract-identity{display:flex;align-items:flex-start;gap:10px;min-width:0}.tree-toggle{flex:none;width:34px;height:34px;border:1px solid #b9c8c2;background:#f4f8f6;border-radius:6px;font-family:Arial;font-size:18px}.tree-spacer{width:34px;flex:none}.contract-type{font-size:12px;font-weight:700;color:var(--jade)}.independent .contract-type{color:var(--blue)}.contract-head h3{font-size:19px;margin:2px 0}.sub .contract-head h3{font-size:16px}.contract-meta{font-size:12px;color:var(--muted)}.contract-actions{display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end}.file-input{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}

    .trace{padding:15px 18px;background:#f7faf8;border-bottom:1px solid var(--line)}.trace-top{display:flex;align-items:center;justify-content:space-between;gap:12px}.trace h4{margin:0;font-size:15px}.formula{font-family:Arial,sans-serif;font-size:12px;color:#235044;background:#e5f0eb;border:1px solid #c8dcd4;border-radius:5px;padding:5px 8px}.trace-row{display:grid;grid-template-columns:minmax(180px,1.5fr) 1fr 1fr;gap:12px;padding:8px 0;border-top:1px solid #e0e8e4;font-size:13px}.trace-list{margin-top:8px}.trace-row span:last-child{text-align:right;font-family:Arial,sans-serif;font-variant-numeric:tabular-nums}
    .contract-foot{padding:13px 18px;display:flex;align-items:center;justify-content:space-between;gap:14px}.files{display:flex;align-items:center;gap:6px;flex-wrap:wrap}.files>span{font-size:12px;color:var(--muted)}.file-chip{display:inline-flex;align-items:center;gap:6px;max-width:240px;border:1px solid #b9c9c2;background:#f6faf8;border-radius:6px;padding:6px 9px;font-size:12px}.file-icon{font-family:Arial;font-size:9px;font-weight:700;color:var(--jade);border:1px solid currentColor;padding:1px 3px;border-radius:2px}.node-btn{margin-left:auto}
    .nodes{padding:16px 18px;border-top:1px solid var(--line)}.node-head,.group-summary-head{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;margin-bottom:10px}.node-head h4,.group-summary h4{margin:0;font-size:15px}.node-head p{margin:3px 0 0;font-size:12px;color:var(--muted)}
    .group-summary{margin:0 0 0 34px;background:#eaf3ef;border:1px solid #cbded6;border-left:3px solid var(--jade);border-radius:8px;padding:13px 16px}.group-summary-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.group-total span,.group-total strong{display:block}.group-total span{font-size:12px;color:var(--muted)}.group-total strong{text-align:right;font-size:17px;margin-top:3px}
    .scroll-shell{position:relative;border:1px solid var(--line);border-radius:7px;background:#fff}.table-scroll{overflow-x:auto}.scroll-shell.is-overflowing:after{content:"";position:absolute;pointer-events:none;right:0;top:0;bottom:28px;width:42px;background:linear-gradient(90deg,transparent,rgba(19,33,29,.18))}.scroll-hint{display:none;text-align:center;padding:5px;color:var(--muted);font-size:12px;background:#f4f7f5;border-top:1px solid var(--line)}.scroll-shell.is-overflowing .scroll-hint{display:block}table{width:100%;min-width:760px;border-collapse:collapse;font-size:13px}th,td{text-align:left;padding:10px 12px;border-bottom:1px solid #e2e8e5;white-space:nowrap}th{background:#edf3f0;color:#31463e}th.num,td.num{text-align:right}tbody tr:last-child td{border-bottom:0}tbody tr:hover{background:#f7faf8}.negative{color:var(--red);font-weight:700}
    .modal-backdrop{position:fixed;inset:0;z-index:100;background:rgba(8,18,15,.58);display:none;align-items:center;justify-content:center;padding:20px}.modal-backdrop.show{display:flex}.modal{width:min(700px,100%);max-height:88vh;overflow:auto;background:#fff;border-radius:12px;box-shadow:0 24px 80px rgba(0,0,0,.32)}.modal-head{position:sticky;top:0;z-index:1;background:#fff;display:flex;align-items:center;justify-content:space-between;padding:18px 21px;border-bottom:1px solid var(--line)}.modal-head h3{margin:0;font-size:20px}.close{width:44px;height:44px;border:0;border-radius:50%;background:#eef3f1;font-family:Arial;font-size:22px}.modal-body{padding:20px 21px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}.field{display:grid;gap:6px}.field.full{grid-column:1/-1}.field label{font-size:14px;font-weight:700}.field input,.field select{width:100%;min-height:44px;border:1px solid #aab9b3;border-radius:7px;background:#fff;padding:9px 11px}.field small{font-size:12px;color:var(--muted)}.modal-foot{display:flex;justify-content:flex-end;gap:8px;padding:15px 21px;border-top:1px solid var(--line)}.toast{position:fixed;right:24px;bottom:24px;z-index:200;max-width:430px;background:var(--ink);color:#fff;border-left:4px solid #4db296;border-radius:8px;padding:13px 16px;box-shadow:0 14px 36px rgba(0,0,0,.25);display:none}.toast.show{display:block}.toast.error{border-left-color:#e05b54}
    @media(max-width:1180px){.project-grid{grid-template-columns:1fr 1fr}.core-grid{grid-template-columns:repeat(3,1fr)}.core-kpi{border-bottom:1px solid var(--line)}.metric-grid{grid-template-columns:repeat(2,1fr)}.metric:nth-child(2n){border-right:0}.metric:nth-child(odd){border-right:1px solid var(--line)}}
    @media(max-width:760px){body{font-size:16px}.appbar-inner{padding:10px 13px;flex-wrap:wrap}.appbar-context{order:3;width:100%;margin:0;padding:8px 0 0;border-left:0;border-top:1px solid #496159}.appbar-actions .btn-dark{display:none}.page{padding:14px 12px 55px}.hero{padding:20px}.hero h1{font-size:24px}.portfolio-strip{grid-template-columns:1fr 1fr;gap:15px}.portfolio-stat{border:0;padding:0}.filterbar,.section-head,.project-banner-row,.contract-head,.contract-foot{align-items:flex-start;flex-direction:column}.segmented{width:100%;overflow-x:auto}.segmented button{white-space:nowrap}.project-grid{grid-template-columns:1fr}.core-grid{grid-template-columns:1fr 1fr}.core-kpi{border-left:0}.metric-grid{grid-template-columns:1fr}.metric,.metric:nth-child(odd){border-right:0}.contract-actions{width:100%}.contract-actions .btn,.contract-actions label{flex:1;text-align:center}.contract-card.sub{margin-left:17px}.group-summary{margin-left:17px}.group-summary-grid{grid-template-columns:1fr}.trace-row{grid-template-columns:1fr}.trace-row span:last-child{text-align:left}.form-grid{grid-template-columns:1fr}.field.full{grid-column:auto}.fab{right:14px;bottom:14px}.project-nav{width:100%}}

<body>
  <header class="appbar"><div class="appbar-inner">
    <div class="brand"><div class="brand-mark" aria-hidden="true">衡</div><div><strong>衡价云</strong><small>多项目造价管理数据库</small></div></div>
    <div class="appbar-context" id="appbarContext"><small>当前范围</small><b>全部项目</b></div>
    <div class="appbar-actions" id="appbarActions"></div>
  </div></header>

  <main class="page" id="homeView" tabindex="-1">
    <section class="hero" aria-labelledby="homeTitle"><p class="eyebrow">PROJECT COST DATABASE · 项目独立核算</p><h1 id="homeTitle">每个项目一套账，全部项目一眼掌握</h1><p>从项目总览进入单项目成本账卡。合同、变更、付款和附件始终跟随项目，不跨项目汇总。</p><div class="portfolio-strip" id="portfolioStrip"></div></section>
    <div class="filterbar"><h2>项目数据库</h2><div class="segmented" role="group" aria-label="按业态筛选"><button data-filter="全部" aria-pressed="true">全部</button><button data-filter="办公" aria-pressed="false">办公</button><button data-filter="住宅" aria-pressed="false">住宅</button><button data-filter="商业综合体" aria-pressed="false">商业综合体</button></div></div>
    <section class="project-grid" id="projectGrid" aria-live="polite"></section>
    <button class="fab" id="newProjectBtn">＋ 新建项目</button>
  </main>

  <main class="page hidden" id="projectView" tabindex="-1">
    <section class="project-banner"><div class="project-banner-row"><div><p class="eyebrow">CURRENT PROJECT · 当前项目独立账套</p><h1 id="currentProjectTitle"></h1><div class="project-code" id="currentProjectCode"></div></div><div class="tag-row" id="currentProjectTags"></div></div><div class="project-info" id="currentProjectInfo"></div></section>
    <section class="core-grid" id="coreGrid"></section>
    <div class="section-head"><div><h2>合同造价账卡</h2><p id="ledgerNote">总包合同汇总下级专业分包；独立承包单独核算。</p></div></div>
    <section class="tree" id="contractTree" aria-live="polite"></section>
  </main>

  <div class="modal-backdrop" id="projectModal" role="dialog" aria-modal="true" aria-labelledby="projectModalTitle"><form class="modal" id="projectForm"><div class="modal-head"><h3 id="projectModalTitle">新建项目</h3><button type="button" class="close" data-close aria-label="关闭">×</button></div><div class="modal-body"><div class="form-grid">
    <div class="field"><label for="projectCodeInput">项目编号</label><input id="projectCodeInput" name="projectCode" required></div><div class="field"><label for="projectNameInput">项目名称</label><input id="projectNameInput" name="projectName" required></div>
    <div class="field"><label for="locationInput">地点</label><input id="locationInput" name="location" required></div><div class="field"><label for="businessInput">业态</label><select id="businessInput" name="businessType"><option>办公</option><option>住宅</option><option>商业综合体</option></select></div>
    <div class="field"><label for="targetInput">目标成本（不含税，元）</label><input id="targetInput" name="targetCostNet" type="number" min="0" step="0.01" required></div><div class="field"><label for="areaInput">建筑面积（㎡）</label><input id="areaInput" name="buildingArea" type="number" min="0.01" step="0.01" required></div>
    <div class="field"><label for="statusInput">状态</label><select id="statusInput" name="status"><option>在建</option><option>完工</option><option>归档</option></select></div>
  </div></div><div class="modal-foot"><button type="button" class="btn btn-outline" data-close>取消</button><button class="btn btn-primary">保存项目</button></div></form></div>

  <div class="modal-backdrop" id="entryModal" role="dialog" aria-modal="true" aria-labelledby="entryTitle"><form class="modal" id="entryForm"><div class="modal-head"><h3 id="entryTitle">登记数据</h3><button type="button" class="close" data-close aria-label="关闭">×</button></div><div class="modal-body" id="entryBody"></div><div class="modal-foot"><button type="button" class="btn btn-outline" data-close>取消</button><button class="btn btn-primary">保存并刷新</button></div></form></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="https://cdn.jsdelivr.net/npm/dexie@4.0.11/dist/dexie.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script>
  (()=>{
    'use strict';
    const db=new Dexie('HengJiaYunMultiProjectDB_v1');
    db.version(1).stores({
      projects:'&projectId,projectCode,projectName,businessType,status,createdAt',
      contracts:'&contractId,projectId,parentContractId,contractType,contractCode,signDate',
      changes:'&changeId,contractId,changeDate,auditStatus',
      payments:'&paymentId,contractId,paymentDate,nodeName',
      files:'&fileId,relationType,relationId,[relationType+relationId],fileType'
    });
    const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];

    async function projectData(projectId){
      const project=await db.projects.get(projectId);if(!project)return null;
      const contracts=await db.contracts.where('projectId').equals(projectId).toArray();const ids=contracts.map(x=>x.contractId);
      const changes=ids.length?await db.changes.where('contractId').anyOf(ids).toArray():[];const payments=ids.length?await db.payments.where('contractId').anyOf(ids).toArray():[];const files=ids.length?(await db.files.where('relationId').anyOf(ids).toArray()):[];
      return {project,contracts,changes,payments,files};
    }
    function ownCalc(project,contract,changes,payments){
      const cs=changes.filter(x=>x.contractId===contract.contractId),ps=payments.filter(x=>x.contractId===contract.contractId),taxRate=contract.amountNet?contract.amountTax/contract.amountNet-1:0,changeTax=cs.reduce((s,x)=>s+Number(x.amountTax||0),0),changeNet=changeTax/(1+taxRate),settleTax=Number(contract.amountTax||0)+changeTax,settleNet=Number(contract.amountNet||0)+changeNet,paid=ps.reduce((s,x)=>s+Number(x.amount||0),0),area=Number(project.buildingArea||0),target=Number(project.targetCostNet||0);
      return {taxRate,changeTax,changeNet,settleTax,settleNet,paid,contractUnitNet:area?contract.amountNet/area:0,settleUnitNet:area?settleNet/area:0,changeRatio:contract.amountTax?changeTax/contract.amountTax:0,payRatio:settleTax?paid/settleTax:0,remaining:settleTax-paid,overTarget:settleNet-target};
    }
    function rollup(project,root,contracts,changes,payments){const members=[root,...contracts.filter(x=>x.parentContractId===root.contractId)],calcs=members.map(x=>ownCalc(project,x,changes,payments));return calcs.reduce((a,x)=>({contractTax:a.contractTax+x.settleTax-x.changeTax,contractNet:a.contractNet+(x.settleNet-x.changeNet),changeTax:a.changeTax+x.changeTax,settleTax:a.settleTax+x.settleTax,settleNet:a.settleNet+x.settleNet,paid:a.paid+x.paid}),{contractTax:0,contractNet:0,changeTax:0,settleTax:0,settleNet:0,paid:0})}
    function projectTotals(data){const roots=data.contracts.filter(x=>!x.parentContractId);return roots.reduce((a,r)=>{const g=rollup(data.project,r,data.contracts,data.changes,data.payments);for(const k of Object.keys(a))a[k]+=g[k];return a},{contractTax:0,contractNet:0,changeTax:0,settleTax:0,settleNet:0,paid:0})}

    function contractGroup(project,root,contracts,changes,payments,files){const children=contracts.filter(x=>x.parentContractId===root.contractId),expanded=state.expanded[root.contractId]!==false,group=rollup(project,root,contracts,changes,payments);return `<div class="contract-group">${contractCard(project,root,changes,payments,files,children.length,expanded)}${children.length&&expanded?children.map(x=>contractCard(project,x,changes,payments,files,0,false)).join(''):''}${children.length&&expanded?`<div class="group-summary"><div class="group-summary-head"><h4>${esc(root.contractName)} · 含下级专业分包汇总</h4><span class="formula">总包自身 + ${children.length} 个专业分包</span></div><div class="group-summary-grid"><div class="group-total"><span>合同金额（含税）</span><strong class="num">¥ ${fmt(group.contractTax)}</strong></div><div class="group-total"><span>变更累计（含税）</span><strong class="num">¥ ${fmt(group.changeTax)}</strong></div><div class="group-total"><span>付款累计（含税）</span><strong class="num">¥ ${fmt(group.paid)}</strong></div></div></div>`:''}</div>`}
    function metric(id,key,label,value,note,alert=false){const open=state.trace[id]===key;return `<button class="metric ${alert?'alert':''}" data-trace="${key}" data-id="${id}" aria-expanded="${open}"><span class="metric-label">${alert?'<span><span class="warn-icon" aria-hidden="true">⚠</span>'+label+'</span>':label}</span><strong class="metric-value">${value}</strong><small class="metric-note">${note}</small></button>`}
    function contractCard(project,contract,changes,payments,files,childCount,expanded){const o=ownCalc(project,contract,changes,payments),isSub=contract.contractType==='专业分包',isIndependent=contract.contractType==='独立承包',trace=state.trace[contract.contractId],nodesOpen=state.nodes[contract.contractId],ownFiles=files.filter(f=>f.relationType==='合同'&&f.relationId===contract.contractId);return `<article class="contract-card ${isSub?'sub':''} ${isIndependent?'independent':''}"><header class="contract-head"><div class="contract-identity">${childCount?`<button class="tree-toggle" data-tree="${contract.contractId}" aria-expanded="${expanded}" aria-label="${expanded?'折叠':'展开'}专业分包">${expanded?'−':'+'}</button>`:'<span class="tree-spacer"></span>'}<div><span class="contract-type">${contract.contractType}${childCount?` · ${childCount} 个专业分包`:''}</span><h3>${esc(contract.contractName)}</h3><div class="contract-meta num">${esc(contract.contractCode)} · 签订 ${esc(contract.signDate)} · 推算税率 ${pct(o.taxRate)}</div></div></div><div class="contract-actions"><input class="file-input" type="file" id="file-${contract.contractId}" data-file="${contract.contractId}" accept=".xlsx,.xls,.pdf,image/*"><label class="btn btn-outline btn-small" for="file-${contract.contractId}">上传原始清单</label><button class="btn btn-outline btn-small" data-entry="change" data-id="${contract.contractId}">登记变更</button><button class="btn btn-primary btn-small" data-entry="payment" data-id="${contract.contractId}">登记付款</button></div></header><div class="metric-grid">

    function traceBlock(key,project,contract,changes,payments,o){let title='',formula='',rows=[];const cs=changes.filter(x=>x.contractId===contract.contractId),ps=payments.filter(x=>x.contractId===contract.contractId);if(key==='contract'){title='合同金额溯源';formula='含税 ÷ (1 + 税率) = 不含税';rows=[['合同金额（含税）',contract.contractCode,`¥ ${fmt(contract.amountTax)}`],['合同金额（不含税）',`税率 ${pct(o.taxRate)}`,`¥ ${fmt(contract.amountNet)}`]]}if(key==='unit'){title='合同单方溯源';formula='合同不含税 ÷ 建筑面积';rows=[['合同金额（不含税）',contract.contractCode,`¥ ${fmt(contract.amountNet)}`],['建筑面积',project.projectCode,`${fmt(project.buildingArea)} ㎡`],['合同单方','自动计算',`¥ ${fmt(o.contractUnitNet)} /㎡`]]}if(key==='change'){title='变更累计溯源';formula='Σ 变更含税金额';rows=cs.length?cs.map(x=>[`${x.changeCode} · ${x.changeType}`,`${x.changeDate} · ${x.auditStatus}`,`¥ ${fmt(x.amountTax)}`]):[['暂无变更','登记后自动计入','¥ 0.00']]}if(key==='settle'){title='结算金额溯源';formula='合同金额 + 变更累计';rows=[['合同金额（含税）',contract.contractCode,`¥ ${fmt(contract.amountTax)}`],['变更累计（含税）',`${cs.length} 份`,`¥ ${fmt(o.changeTax)}`],['结算金额（含税）','自动计算',`¥ ${fmt(o.settleTax)}`]]}if(key==='settleUnit'){title='结算单方溯源';formula='结算不含税 ÷ 建筑面积';rows=[['结算金额（不含税）','合同 + 变更折税',`¥ ${fmt(o.settleNet)}`],['建筑面积',project.projectCode,`${fmt(project.buildingArea)} ㎡`],['结算单方','自动计算',`¥ ${fmt(o.settleUnitNet)} /㎡`]]}if(key==='target'){title='目标成本预警溯源';formula='结算不含税 − 项目目标成本不含税';rows=[['结算金额（不含税）',contract.contractCode,`¥ ${fmt(o.settleNet)}`],['项目目标成本（不含税）',project.projectCode,`¥ ${fmt(project.targetCostNet)}`],['差额',o.overTarget>0?'超目标预警':'目标内',`${o.overTarget>0?'+':''}¥ ${fmt(o.overTarget)}`]]}if(key==='payment'){title='付款累计溯源';formula='Σ 每笔付款金额';rows=ps.length?ps.map(x=>[x.nodeName,x.paymentDate,`¥ ${fmt(x.amount)}`]):[['暂无付款','登记后自动计入','¥ 0.00']]}if(key==='remaining'){title='剩余未付溯源';formula='结算含税 − 付款累计';rows=[['结算金额（含税）','合同 + 变更',`¥ ${fmt(o.settleTax)}`],['付款累计（含税）',`${ps.length} 笔`,`− ¥ ${fmt(o.paid)}`],['剩余未付（含税）','自动计算',`¥ ${fmt(o.remaining)}`]]}return `<div class="trace"><div class="trace-top"><h4>${title}</h4><span class="formula">${formula}</span></div><div class="trace-list">${rows.map(r=>`<div class="trace-row"><span>${esc(r[0])}</span><span>${esc(r[1])}</span><span>${esc(r[2])}</span></div>`).join('')}</div></div>`}
    function nodeTable(contract,payments,settleTax){const ps=payments.filter(x=>x.contractId===contract.contractId);return `<section class="nodes"><div class="node-head"><div><h4>付款节点</h4><p>节点应付额始终使用最新结算含税金额计算。</p></div><span class="formula">节点应付 = 结算含税 × 节点比例</span></div><div class="scroll-shell"><div class="table-scroll"><table><thead><tr><th>节点名称</th><th class="num">节点比例</th><th class="num">应付金额（含税，元）</th><th class="num">已付金额（含税，元）</th><th class="num">未付金额（含税，元）</th></tr></thead><tbody>${contract.nodes.map(n=>{const due=settleTax*n.ratio,paid=ps.filter(p=>p.nodeName===n.name).reduce((s,p)=>s+Number(p.amount),0),left=due-paid;return `<tr><td>${esc(n.name)}</td><td class="num">${pct(n.ratio)}</td><td class="num">¥ ${fmt(due)}</td><td class="num">¥ ${fmt(paid)}</td><td class="num ${left<0?'negative':''}">${left<0?'<span class="warn-icon" aria-hidden="true">⚠</span>':''}¥ ${fmt(left)}</td></tr>`}).join('')}</tbody></table></div><div class="scroll-hint">← 横向滑动查看更多 →</div></div></section>`}

    function bindHome(){$$('[data-filter]').forEach(b=>b.addEventListener('click',()=>{state.filter=b.dataset.filter;$$('[data-filter]').forEach(x=>x.setAttribute('aria-pressed',x===b));renderHome()}));$$('[data-open-project]').forEach(b=>b.addEventListener('click',()=>openProject(b.dataset.openProject)))}
    function bindProject(data){$('#homeBtn').addEventListener('click',goHome);$('#exportBtn').addEventListener('click',()=>exportProject(data));$$('[data-tree]').forEach(b=>b.addEventListener('click',()=>{state.expanded[b.dataset.tree]=!b.getAttribute('aria-expanded').includes('true');renderProject()}));$$('[data-trace]').forEach(b=>b.addEventListener('click',()=>{state.trace[b.dataset.id]=state.trace[b.dataset.id]===b.dataset.trace?null:b.dataset.trace;renderProject()}));$$('[data-nodes]').forEach(b=>b.addEventListener('click',()=>{state.nodes[b.dataset.nodes]=!state.nodes[b.dataset.nodes];renderProject()}));$$('[data-entry]').forEach(b=>b.addEventListener('click',()=>openEntry(b.dataset.id,b.dataset.entry)));$$('[data-file]').forEach(i=>i.addEventListener('change',e=>saveFile(e.target.dataset.file,e.target.files[0])));$$('[data-open-file]').forEach(b=>b.addEventListener('click',()=>openFile(b.dataset.openFile)))}
    function openProject(id){history.pushState({projectId:id},'',`?projectId=${encodeURIComponent(id)}`);state.projectId=id;renderProject();scrollTo({top:0,behavior:'smooth'})}function goHome(){history.pushState({},'',location.pathname);state.projectId=null;state.trace={};state.nodes={};renderHome();scrollTo({top:0,behavior:'smooth'})}
    function openEntry(id,type){state.entryContractId=id;state.entryType=type;$('#entryTitle').textContent=type==='change'?'登记变更':'登记付款';$('#entryBody').innerHTML=type==='change'?`<div class="form-grid"><div class="field"><label for="changeCode">变更编号</label><input id="changeCode" name="changeCode" required></div><div class="field"><label for="changeType">变更类型</label><select id="changeType" name="changeType"><option>设计变更</option><option>签证</option><option>索赔</option></select></div><div class="field"><label for="changeAmount">变更金额（含税，元）</label><input id="changeAmount" name="amountTax" type="number" step="0.01" required></div><div class="field"><label for="auditStatus">审定状态</label><select id="auditStatus" name="auditStatus"><option>待审</option><option>已审</option></select></div><div class="field"><label for="changeDate">变更日期</label><input id="changeDate" name="changeDate" type="date" value="${today()}" required></div></div>`:`<div class="form-grid"><div class="field"><label for="paymentAmount">付款金额（含税，元）</label><input id="paymentAmount" name="amount" type="number" min="0.01" step="0.01" required></div><div class="field"><label for="nodeName">付款节点名称</label><select id="nodeName" name="nodeName"></select></div><div class="field"><label for="paymentDate">付款日期</label><input id="paymentDate" name="paymentDate" type="date" value="${today()}" required></div></div>`;if(type==='payment')db.contracts.get(id).then(c=>{$('#nodeName').innerHTML=c.nodes.map(n=>`<option>${esc(n.name)}</option>`).join('')});openModal('entryModal')}
    async function saveFile(contractId,file){if(!file)return;const kind=/excel|spreadsheet|\.xls/i.test(file.type+file.name)?'excel':/pdf/i.test(file.type+file.name)?'pdf':'scan';await db.files.add({fileId:uid('F'),relationType:'合同',relationId:contractId,fileName:file.name,fileType:kind,fileBlob:file,createdAt:new Date().toISOString()});toast(`已保存原始文件：${file.name}`);renderProject()}
    async function openFile(id){const f=await db.files.get(id);if(!f)return;const url=URL.createObjectURL(f.fileBlob);if(f.fileType==='excel'){const a=document.createElement('a');a.href=url;a.download=f.fileName;a.click()}else window.open(url,'_blank','noopener');setTimeout(()=>URL.revokeObjectURL(url),60000)}
    async function exportProject(data){if(!window.XLSX){toast('Excel 导出组件未加载，请检查网络后重试。',true);return}const wb=XLSX.utils.book_new(),p=data.project;XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet([p]),'项目');XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(data.contracts.map(x=>({...x,nodes:JSON.stringify(x.nodes)}))),'合同');XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(data.changes),'变更');XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(data.payments),'付款');XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(data.files.map(({fileBlob,...x})=>x)),'文件索引');XLSX.writeFile(wb,`${p.projectCode}-${p.projectName}-造价数据库.xlsx`);toast('本项目数据已导出为 Excel。')}
    function openModal(id){const m=$('#'+id);m.classList.add('show');m.querySelector('input,select,button')?.focus()}function closeModals(){$$('.modal-backdrop.show').forEach(x=>x.classList.remove('show'))}function toast(msg,error=false){const t=$('#toast');t.textContent=msg;t.className=`toast show${error?' error':''}`;clearTimeout(toast.timer);toast.timer=setTimeout(()=>t.className='toast',3500)}function checkOverflow(){$$('.scroll-shell').forEach(s=>{const x=s.querySelector('.table-scroll');s.classList.toggle('is-overflowing',x.scrollWidth>x.clientWidth+2)})}
    $('#newProjectBtn').addEventListener('click',()=>openModal('projectModal'));$('#projectForm').addEventListener('submit',async e=>{e.preventDefault();const v=Object.fromEntries(new FormData(e.target));if(await db.projects.where('projectCode').equals(v.projectCode.trim()).first()){toast('项目编号已存在，请修改后再保存。',true);return}const p={projectId:uid('P'),projectCode:v.projectCode.trim(),projectName:v.projectName.trim(),location:v.location.trim(),businessType:v.businessType,targetCostNet:Number(v.targetCostNet),buildingArea:Number(v.buildingArea),status:v.status,createdAt:new Date().toISOString()};await db.projects.add(p);e.target.reset();closeModals();toast('项目已新建。');openProject(p.projectId)});
    $('#entryForm').addEventListener('submit',async e=>{e.preventDefault();const v=Object.fromEntries(new FormData(e.target));if(state.entryType==='change')await db.changes.add({changeId:uid('CH'),contractId:state.entryContractId,changeCode:v.changeCode.trim(),changeType:v.changeType,amountTax:Number(v.amountTax),auditStatus:v.auditStatus,changeDate:v.changeDate});else await db.payments.add({paymentId:uid('PAY'),contractId:state.entryContractId,amount:Number(v.amount),nodeName:v.nodeName,paymentDate:v.paymentDate});e.target.reset();closeModals();toast(state.entryType==='change'?'变更已保存，结算及预警已实时更新。':'付款已保存，付款进度及节点余额已实时更新。');renderProject()});
    $$('[data-close]').forEach(b=>b.addEventListener('click',closeModals));$$('.modal-backdrop').forEach(m=>m.addEventListener('click',e=>{if(e.target===m)closeModals()}));document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModals()});window.addEventListener('popstate',render);window.addEventListener('resize',checkOverflow);
    if(!window.Dexie){document.body.innerHTML='<main class="page"><div class="empty"><h3>数据库组件未加载</h3><p>请检查网络连接后刷新页面。</p></div></main>';return}seed().then(render).catch(err=>{console.error(err);toast('IndexedDB 初始化失败，请确认浏览器允许本地存储。',true)});
  })();
  </script>
